name: hub-042

services:
  db:
    image: postgres:16-alpine
    container_name: hub042_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-webapp_db}
      POSTGRES_USER: ${DB_USER:-webapp_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-webapp_user} -d ${DB_NAME:-webapp_db}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - hub042_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${APP_VERSION:-dev}
    image: ghcr.io/baniox/hub-042:latest
    container_name: hub042_server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      APP_NAME: ${APP_NAME:-Alban}
      APP_VERSION: ${APP_VERSION:-dev}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-webapp_db}
      DB_USER: ${DB_USER:-webapp_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET fehlt}
      RESET_PASSWORD: ${RESET_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Zugang: Teilnehmerliste nur in .env (nicht im öffentlichen Repo)
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      DOZENT_EMAILS: ${DOZENT_EMAILS:-}
      TEILNEHMER_EMAILS: ${TEILNEHMER_EMAILS:-}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Hilfe-Bot (optional): ohne Key antwortet die lokale FAQ
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    volumes:
      # Downloads-Bereich: Dateien liegen nur lokal (nicht im öffentlichen Repo)
      - ./downloads:/app/downloads:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - hub042_net

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: hub042_tunnel
    restart: unless-stopped
    # Metrics-Endpunkt (nur im internen Netz), damit HUB-042 die aktuelle Adresse samt QR-Code anzeigen kann
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://app:3000
    depends_on:
      app:
        condition: service_healthy
    networks:
      - hub042_net

  # Optional: feste Gratis-Adresse https://hub-042.<tailnet>.ts.net über Tailscale Funnel
  # Start: docker compose --profile tailscale up -d   (braucht TS_AUTHKEY in .env, siehe README)
  tailscale:
    image: tailscale/tailscale:latest
    container_name: hub042_tailscale
    profiles: ["tailscale"]
    restart: unless-stopped
    hostname: hub-042
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: hub-042
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./config/tailscale-serve.json:/config/serve.json:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - hub042_net

  watchtower:
    image: containrrr/watchtower:latest
    container_name: hub042_watchtower
    restart: unless-stopped
    environment:
      - DOCKER_API_VERSION=1.44
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 30 --cleanup
    depends_on:
      - app

volumes:
  postgres_data:
    driver: local
    # Fester Name, damit die bestehende Datenbank auch nach der Umbenennung
    # (Projekt/Ordner hub-042) weiterverwendet wird. Anderes Volume: DB_VOLUME in .env
    name: ${DB_VOLUME:-modul042-webapp_postgres_data}

  tailscale_state:
    driver: local

networks:
  hub042_net:
    driver: bridge
